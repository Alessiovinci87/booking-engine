name: Stripe notturna

# Suite Stripe/* (10-TRACEABILITY) contro l'API di Stripe in modalità test: ogni notte e a richiesta.
# Non gira su push e pull request: dipende da un servizio esterno e dal segreto STRIPE_SECRET.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-nightly
  cancel-in-progress: false

jobs:
  stripe:
    name: Suite Stripe/* in modalità test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: booking_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Credenziali usa e getta, valide solo dentro il job (servizi effimeri).
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: booking_engine
      DB_TEST_DATABASE: booking_engine_test
      DB_USERNAME: app_runtime
      DB_PASSWORD: ci-runtime
      DB_MIGRATOR_USERNAME: app_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator
      DB_ADMIN_OPS_USERNAME: app_admin_ops
      DB_ADMIN_OPS_PASSWORD: ci-admin-ops
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - name: Ruoli ed estensioni PostgreSQL (stessi script di docker/postgres/init)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGPASSWORD: ci-superuser
          POSTGRES_USER: postgres
          POSTGRES_DB: booking_engine
          APP_TEST_DATABASE: booking_engine_test
          APP_E2E_DATABASE: booking_engine_e2e
          APP_MIGRATOR_PASSWORD: ci-migrator
          APP_RUNTIME_PASSWORD: ci-runtime
          APP_ADMIN_OPS_PASSWORD: ci-admin-ops
        run: |
          for script in docker/postgres/init/*.sh; do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done
          psql -U postgres -d booking_engine -c "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname LIKE 'app_%' ORDER BY 1"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, mbstring, bcmath, zip, gd, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dipendenze PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configurazione
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migration con app_migrator
        run: php artisan migrate --database=pgsql_migrator --force

      - name: Suite Stripe/* (API di Stripe in modalità test)
        env:
          # Segreto del repository; la chiave non viene mai stampata.
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          STRIPE_TEST_CONNECTED_ACCOUNT: ${{ vars.STRIPE_TEST_CONNECTED_ACCOUNT }}
          STRIPE_LIVE_TESTS: '1'
        run: |
          case "$STRIPE_SECRET" in
            sk_test_*) ;;
            *) echo "::error::STRIPE_SECRET mancante o non di test"; exit 1 ;;
          esac
          php artisan config:clear
          php vendor/bin/pest -c phpunit.stripe.xml
